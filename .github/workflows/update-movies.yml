name: Update movies.json from site

on:
  schedule:
    # every week on Monday at 07:00 UTC (10:30 Tehran IRST)
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: update-movies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Scrape site and update movies.json
        run: python scripts/update-movies.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update movies.json from ispanechannel (weekly sync)"
            git push
          fi