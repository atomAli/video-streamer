name: Update serials.json from site

on:
  schedule:
    # every day at 06:00 UTC (09:30 Tehran IRST)
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-serials
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Scrape site and update serials.json
        run: python scripts/update-serials.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serials.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update serials.json from ispanechannel (daily sync)"
            git push
          fi